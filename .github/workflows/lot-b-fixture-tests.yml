name: Lot B synthetic acceptance (expected RED baseline)

on:
  push:
    branches: [pilot/lot-b-synthetic-fixture]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          persist-credentials: false
      - name: Python stdlib acceptance
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
